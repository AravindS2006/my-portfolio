        background-clip: text;
      }
      /* Glow effects */

      /* Loading screen fade */
      .loading-fade-exit {
        animation: loadingFadeExit 0.6s ease forwards;
      }
      @keyframes loadingFadeExit {
        0% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.05); pointer-events: none; }
      }
